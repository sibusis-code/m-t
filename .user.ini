; Raises the upload ceiling for material files (admin-materials.php), under
; PHP-FPM/FastCGI — which is Xneelo's setup, per the note in .htaccess about
; why php_flag/php_value directives don't work there. .user.ini is read by
; PHP itself, per-directory, so it works under FastCGI where an Apache
; directive would not.
;
; Applies to EVERY page under this directory, not just the upload page —
; PHP-FPM reads .user.ini recursively down the tree. Kept modest rather than
; "unlimited" for exactly that reason: this is a blast-radius change, not a
; single-page one.
;
; THIS IS A REQUEST, NOT A GUARANTEE. Xneelo's shared-hosting package may
; enforce its own ceiling regardless of what this file asks for, and
; PHP-FPM's user_ini.cache_ttl means a change here is not instant even when it
; does take effect (roughly five minutes by default). The number that
; actually governs an upload is whatever admin-materials.php reads live via
; ini_get('upload_max_filesize') — read that after deploying, not this file.
upload_max_filesize = 300M
post_max_size = 310M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
